workflow:
  mode: plan
  outcome:
    subject: governed_components
    required_gates: [typecheck]
  target_architecture:
    summary: >-
      Language-agnostic mutation-testing engine: Rust inference core
      (tokens in/out, no language knowledge) + per-language frontends
      behind a Language protocol (find_targets / validate / test-runner /
      selection). Five languages (Roman 2026-09-06): Python (ast+pytest,
      shipped), JS/TS/Kotlin/Swift via one shared tree-sitter parser
      layer. Interpreted languages use file-swap test cycles; compiled
      (Kotlin/Swift) use mutation schemata: all mutants of a function
      compiled in once behind a runtime switch, one build per file.
      One fine-tuned multilingual mutant model (v3+).
    invariants:
    - Inference core never parses source code; only the Language layer does
    - Training prompt format == serving prompt format, per language
    - Kill-rate accounting (NO_TESTS distinct from SURVIVED) is language-neutral
  delivery_strategy:
    summary: Describe how this change moves current code toward the target architecture

[package]
name = "supermut"
version = "0.1.0"
edition = "2024"

[lib]
name = "supermut"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
encoding_rs = "0.8"

# Metal on macOS, plain CPU elsewhere (CI runners, Linux users).
# CUDA is an opt-in build feature, not a default — keeps manylinux wheels portable.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.156" }

[features]
default = []
cuda = ["llama-cpp-2/cuda"]

[profile.release]
lto = "thin"

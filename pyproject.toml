[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "supermut"
description = "Fast local inference for mutation-test generation (llama.cpp core: Metal on macOS, CPU on Linux)"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "huggingface_hub>=0.30",
    "coverage>=7",
]

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "supermut._core"
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo"
]

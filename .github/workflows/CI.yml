# Based on `maturin generate-ci github` (maturin v1.15.0), narrowed for a
# llama.cpp-embedding crate:
# - linux matrix: x86_64 + aarch64 only (armv7/s390x/ppc64le would mean QEMU
#   cross-builds of the C++ core for platforms nobody runs mutation testing on)
# - manylinux container needs cmake + clang for llama-cpp-sys-2/bindgen
# - test job runs the pure-Python unit tests against a dev build; integration
#   tests skip automatically without a GGUF model
name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cmake (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Build and test
        # pip drives maturin as the build backend — no virtualenv needed,
        # unlike `maturin develop` which refuses to run without one.
        # Tests run against the INSTALLED wheel; running pytest from the
        # repo root would shadow it with the sourcetree (which has no .so).
        run: |
          pip install -v "$GITHUB_WORKSPACE" pytest
          pytest "$GITHUB_WORKSPACE/python/tests" -q
        working-directory: ${{ runner.temp }}

  linux:
    # x86_64 only for now: cross-building the llama.cpp C++ core for aarch64
    # under QEMU takes ~an hour; add a native arm runner when needed.
    # manylinux_2_28 (AlmaLinux 8): the manylinux2014 libclang is too old for
    # bindgen (missing clang_getTranslationUnitTargetInfo).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          # static-stdcxx: AlmaLinux 8's GLIBCXX_3.4.25 fails the 2_28
          # symbol audit unless libstdc++ is linked statically.
          args: --release --out dist --find-interpreter --features static-stdcxx
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: 2_28
          before-script-linux: |
            dnf install -y cmake clang clang-devel llvm-devel || yum install -y cmake clang clang-devel llvm-devel
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build wheels (Metal)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-aarch64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [test, linux, macos, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

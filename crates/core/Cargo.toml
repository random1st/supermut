[package]
name = "supermut-core"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8"

# Metal on macOS, plain CPU elsewhere (CI runners, Linux users).
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.156" }

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
static-stdcxx = ["llama-cpp-2/static-stdcxx"]
